<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Harsh Kumar">
  <defs>
    <linearGradient id="flg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8f135"/>
      <stop offset="100%" stop-color="#8ab020"/>
    </linearGradient>
    <filter id="fglow">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" fill="#080808"/>
  <!-- Card body -->
  <rect x="2" y="2" width="28" height="28" rx="3"
    fill="#0d0d0d" stroke="url(#flg)" stroke-width="1.2"
    filter="url(#fglow)" opacity="0.95"/>
  <!-- Top accent -->
  <rect x="2" y="2" width="28" height="6" rx="3" fill="rgba(200,241,53,0.1)"/>
  <rect x="2" y="6" width="28" height="2" fill="rgba(200,241,53,0.1)"/>
  <!-- Top label -->
  <text x="16" y="6.8" text-anchor="middle"
    font-family="'JetBrains Mono','Courier New',monospace"
    font-size="2.8" letter-spacing="1" fill="#c8f135" opacity="0.6">SEC</text>
  <!-- Avatar circle -->
  <circle cx="16" cy="17" r="7"
    fill="rgba(200,241,53,0.06)" stroke="#c8f135" stroke-width="0.8"
    filter="url(#fglow)"/>
  <!-- HK -->
  <text x="16" y="20" text-anchor="middle"
    font-family="'Exo 2','Arial',sans-serif"
    font-size="7" font-weight="800" letter-spacing="0.5"
    fill="url(#flg)" filter="url(#fglow)">HK</text>
  <!-- India tricolour bottom -->
  <rect x="2" y="27" width="9.3" height="3" rx="0.5" fill="#FF9933" opacity="0.7"/>
  <rect x="11.3" y="27" width="9.4" height="3" fill="#f0f0f0" opacity="0.5"/>
  <rect x="20.7" y="27" width="9.3" height="3" rx="0.5" fill="#138808" opacity="0.7"/>
</svg>